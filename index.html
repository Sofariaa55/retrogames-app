<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames | Jogos Clássicos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 RetroGames</h1>
        <p>Uma viagem pelos jogos clássicos</p>
    </header>
    <main>
        <section class="titulo">
            <div>
                <h2>Nossos Games</h2>
                <p>Confira os jogos cadastrados</p>
            </div>
            <button type="button" id="abrirModal">+ Cadastrar Jogo</button>
        </section>
        <section id="catalogo" class="catalogo"></section>
        <p id="mensagemVazia">Nenhum jogo cadastrado</p>
    </main>
    <dialog id="modal">
        <h2>Cadastrar novo jogo</h2>
        <form id="formulario">
            <label for="titulo">Título do jogo</label>
            <input type="text" id="titulo" required>
            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" placeholder="Ex: SNES, PS1, Mega Drive" required>
            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            <label for="imagem">URL da imagem da capa</label>
            <input type="url" id="imagem" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0" step="0.01" required>
            <div class="botoes">
                <button type="button" id="cancelar">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </dialog>
    <footer>
        <p>RetroGames © 2026 | Projeto escolar</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
